name: Refresh verified stations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build:stations
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - name: Commit verified station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/stations public/covers
          if git diff --cached --quiet; then
            echo "No station data changes to commit."
          else
            git commit -m "Refresh verified station data"
            git push
          fi
